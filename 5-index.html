<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse - SaaS analytics dashboard</title>
    <meta name="description" content="A SaaS analytics dashboard built with React, TypeScript, Tailwind and Recharts. Date range and plan filters drive every chart, with a searchable, sortable customer table, dark mode and loading, empty and error states." />
    <meta property="og:title" content="Pulse - SaaS analytics dashboard" />
    <meta property="og:description" content="Revenue, users and churn for a fictional SaaS company. Filters drive every chart and table." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://malakmo7amed309.github.io/pulse/" />
    <meta property="og:image" content="https://malakmo7amed309.github.io/pulse/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M4 17h6l3-8 5 15 3-7h7' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('pulse:theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
